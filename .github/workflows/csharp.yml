name: csharp
on:
  push:
    paths: ['csharp/**', 'shared/**', 'scripts/**', 'vcpkg.json', 'vendor/vcpkg', 'build.sh', '.github/**']
  pull_request:
    paths: ['csharp/**', 'shared/**', 'scripts/**', 'vcpkg.json', 'vendor/vcpkg', 'build.sh', '.github/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-deps
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: csharp/global.json }
      - name: Build + smoke run (headless)
        run: ./build.sh csharp apps/hello-window --test
