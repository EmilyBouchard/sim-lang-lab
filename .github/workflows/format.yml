name: format
# Same check as the pre-commit hook and `./format.sh all --check`. Tool versions are pinned so a
# file that passes locally passes here: keep them in step with the versions you run locally.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CLANG_FORMAT_VERSION: '22.1.3'
  FOURMOLU_VERSION: '0.20.1.0'
  FOURMOLU_SHA256: 'bdd97063b445145b39191259c428bca489fa30578b82d9066fc7377db390f1d0'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: csharp/global.json }
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Install fourmolu
        run: |
          url="https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/fourmolu.zip" "$url"
          echo "${FOURMOLU_SHA256}  $RUNNER_TEMP/fourmolu.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/fourmolu.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/fourmolu-${FOURMOLU_VERSION}-linux-x86_64/fourmolu" "$HOME/.local/bin/fourmolu"
      - name: Show tool versions
        run: |
          clang-format --version
          fourmolu --version
          dotnet --version
      # `dotnet format --no-restore` (used by format.sh) needs the packages restored first.
      - name: Restore C# packages
        run: dotnet restore csharp/SimLangLab.sln
      - name: Check formatting
        run: ./format.sh all --check
