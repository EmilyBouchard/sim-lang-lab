name: cpp
on:
  push:
    paths: ['cpp/**', 'shared/**', 'scripts/**', 'vcpkg.json', 'vendor/vcpkg', 'build.sh', '.github/**']
  pull_request:
    paths: ['cpp/**', 'shared/**', 'scripts/**', 'vcpkg.json', 'vendor/vcpkg', 'build.sh', '.github/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-deps
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: cpp }
      - name: Build + smoke test (ASan/UBSan, dummy video driver)
        run: ./build.sh cpp apps/hello-window --test
