name: cpp
on:
  push:
    paths: ['cpp/**', 'shared/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', 'shared/**', '.github/workflows/cpp.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libsdl3-dev || true
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: cpp }
      # NOTE: libsdl3-dev may not be in Ubuntu's repos yet; see docs/architecture/open-items.md
      - name: Build + smoke test (ASan/UBSan, dummy video driver)
        working-directory: cpp
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug
